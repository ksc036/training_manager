[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-manager"
version = "0.1.0"
description = "Training manager scaffold"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
